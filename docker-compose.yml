services:
  cyberdash:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      # Keep node_modules inside the container (faster, avoids host/arch clashes).
      - cyberdash_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  cyberdash_node_modules:
